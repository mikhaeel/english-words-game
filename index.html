<title>Английские карточки</title>
<style>
:root{--ink:#253653;--purple:#6c4fd3;--green:#20b676;--red:#ed6374;--gold:#ffb84d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(145deg,#b7efff,#eadcff 55%,#fff3b1)}
#app{min-height:100vh;display:grid;place-items:center;padding:18px}.screen{width:min(760px,100%);text-align:center}.panel,.card{background:#fffdf8eF;border:5px solid #fff;border-radius:30px;padding:clamp(20px,5vw,38px);box-shadow:0 14px 34px #453d6934}h1{color:var(--purple);font-size:clamp(2.2rem,7vw,4rem);margin:8px 0 14px}h2{font-size:clamp(1.6rem,5vw,2.5rem)}p{font-size:clamp(1.05rem,3vw,1.25rem);line-height:1.5}.art{font-size:clamp(4rem,12vw,7rem);margin:4px}button{border:0;border-radius:18px;padding:16px 22px;color:#fff;background:var(--purple);font:800 1.1rem inherit;cursor:pointer;box-shadow:0 5px 0 #0002;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.hidden{display:none!important}.choices,.actions,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px;margin:20px auto}.choice{background:#f49a53}.card{min-height:340px;display:grid;align-content:center;justify-items:center}.word{font-size:clamp(2.45rem,10vw,5rem);font-weight:900;line-height:1.05;color:var(--purple);overflow-wrap:anywhere}.ipa{font-size:clamp(1.2rem,4vw,1.65rem);color:#607087;margin:12px}.answer{margin-top:18px;padding:14px 18px;border-radius:17px;background:#e7ffda;font-weight:800;font-size:clamp(1.35rem,5vw,1.85rem)}.illustration{font-size:clamp(4rem,14vw,8rem);line-height:1.1;margin:5px}.progress{font-weight:800;font-size:1.1rem;margin-bottom:10px}.track{height:14px;border:2px solid white;background:#ffffff91;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#36cd90,#ffd450);width:0;transition:.25s}.yes{background:var(--green)}.no{background:var(--red)}.stat{border-radius:18px;padding:16px;color:white;font-size:1.2rem}.stat b{display:block;font-size:3rem}.known{background:var(--green)}.unknown{background:var(--red)}.review{text-align:left;background:#fff;border-radius:16px;padding:12px 22px;max-height:220px;overflow:auto}.review li{margin:8px 0}#fireworks{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;width:10px;height:10px;border-radius:50%;animation:burst 1.25s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:390px){button{font-size:1rem;padding:14px 8px}.card{min-height:300px}}

<body>
<div id="fireworks"></div>
<main id="app">
<section id="welcome" class="screen panel"><div class="art">🌈🚀</div><h1>Привет, юный знаток!</h1><p>Сначала вспомни значение английского слова. После ответа откроется перевод и картинка.</p><button id="start">Вперёд!</button></section>
<section id="select" class="screen panel hidden"><div class="art">🃏✨</div><h2>Сколько слов будет в раунде?</h2><div class="choices"><button class="choice" data-size="10">10 слов</button><button class="choice" data-size="15">15 слов</button><button class="choice" data-size="20">20 слов</button><button class="choice" data-size="25">25 слов</button></div></section>
<section id="game" class="screen hidden"><div id="counter" class="progress"></div><div class="track"><div id="fill" class="fill"></div></div><article class="card"><div id="word" class="word"></div><div id="ipa" class="ipa"></div><div id="illustration" class="illustration hidden" aria-hidden="true"></div><div id="answer" class="answer hidden"></div></article><div id="answers" class="actions"><button id="yes" class="yes">Я знаю! 👍</button><button id="no" class="no">Не помню 🤔</button></div><div id="continue" class="hidden"><button id="next">Следующее слово →</button></div></section>
<section id="result" class="screen panel hidden"><div id="badge" class="art"></div><h1 id="title"></h1><p id="message"></p><div class="stats"><div class="stat known"><b id="knownCount"></b>Знаю</div><div class="stat unknown"><b id="unknownCount"></b>Повторить</div></div><div id="review" class="review hidden"><h2>Повтори эти слова</h2><ul id="reviewList"></ul></div><button id="again">Играть ещё раз 🔄</button></section>
</main>

const words = raw.split('\n').map(line => { const [en,ipa,ru,pic] = line.split('|'); return {en,ipa,ru,pic}; });
const $=id=>document.getElementById(id);let round=[],index=0,answers=[],locked=false;
function show(id){['welcome','select','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startRound(n){round=shuffle(words).slice(0,n);index=0;answers=[];show('game');render()}
function render(){locked=false;const w=round[index];$('word').textContent=w.en;$('ipa').textContent=w.ipa?'/'+w.ipa+'/':'';$('illustration').textContent='';$('illustration').classList.add('hidden');$('answer').textContent='';$('answer').classList.add('hidden');$('answers').classList.remove('hidden');$('continue').classList.add('hidden');$('counter').textContent=`Слово ${index+1} из ${round.length}`;$('fill').style.width=(index/round.length*100)+'%'}
function reply(known){if(locked)return;locked=true;const w=round[index];answers.push({w,known});$('illustration').textContent=w.pic;$('illustration').classList.remove('hidden');$('answer').textContent=w.ru;$('answer').classList.remove('hidden');$('answers').classList.add('hidden');$('continue').classList.remove('hidden');$('next').textContent=index===round.length-1?'Посмотреть результат →':'Следующее слово →'}
function next(){if(!locked)return;if(++index<round.length)render();else finish()}
function finish(){const missed=answers.filter(x=>!x.known),known=answers.length-missed.length,perfect=!missed.length;$('knownCount').textContent=known;$('unknownCount').textContent=missed.length;$('badge').textContent=perfect?'🎆🏆':'🌟💪';$('title').textContent=perfect?'Ты - молодец!':'Ты отлично постался!';$('message').textContent=perfect?'Ты знаешь все слова в этом раунде!':'Повтори слова ниже — и в следующий раз получится ещё лучше!';$('reviewList').replaceChildren();missed.forEach(x=>{const li=document.createElement('li');li.textContent=`${x.w.en} — ${x.w.ru}`;$('reviewList').appendChild(li)});$('review').classList.toggle('hidden',perfect);show('result');if(perfect)fireworks()}
function fireworks(){const host=$('fireworks');for(let b=0;b<6;b++)setTimeout(()=>{const x=10+Math.random()*80,y=10+Math.random()*55;for(let i=0;i<22;i++){const e=document.createElement('i'),a=i*Math.PI*2/22,d=55+Math.random()*120;e.className='spark';e.style.left=x+'vw';e.style.top=y+'vh';e.style.background=['#ff6187','#ffce4a','#50d79d','#7657eb'][i%4];e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');host.append(e);setTimeout(()=>e.remove(),1300)}},b*220)}
